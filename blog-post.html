<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Artículo · Blog Global Crew</title>
<meta name="description" id="pageDescription" content="Blog de Global Crew Valencia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root{
        --navy-950:#3D0910;--navy-800:#750C1B;--navy-700:#9C2A3A;
        --steel:#8C8783;--steel-light:#D6D2CD;--cream:#F7F1EC;--sky:#EFEBE8;
        --coral:#E4572E;--ink:#241E1C;--ink-soft:#6E6763;--line:rgba(43,38,36,0.14);
        --ff-display:'Space Grotesk',sans-serif;--ff-body:'Inter',sans-serif;--ff-mono:'IBM Plex Mono',monospace;
        --radius-lg:22px;--radius-md:14px;--ease:cubic-bezier(.22,.9,.32,1);
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--ff-body);color:var(--ink);background:var(--sky);-webkit-font-smoothing:antialiased;}
    a{text-decoration:none;color:inherit;}
    .hidden{display:none !important;}
    .wrap{max-width:760px;margin:0 auto;padding:0 32px;}
    @media (max-width:640px){.wrap{padding:0 20px;} .mini-nav .wrap{padding:0 20px;}}

    /* ---- nav ---- */
    .mini-nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0;background:var(--navy-950);}
    .mini-nav .wrap{display:flex;align-items:center;justify-content:space-between;max-width:none;width:100%;padding:0 32px;}
    .mini-logo{display:flex;align-items:center;gap:11px;color:var(--cream);}
    .mini-logo-mark{width:38px;height:38px;border-radius:50%;overflow:hidden;flex-shrink:0;background:rgba(247,241,236,.08);}
    .mini-logo-mark img{width:100%;height:100%;object-fit:cover;display:block;}
    .mini-logo-text{font-family:var(--ff-display);font-weight:700;font-size:1.05rem;color:#fff;line-height:1.1;}
    .mini-logo-text span{display:block;font-family:var(--ff-mono);font-size:.58rem;letter-spacing:.14em;color:rgba(247,241,236,.5);font-weight:500;margin-top:2px;}
    .mini-nav-right{display:flex;align-items:center;gap:16px;}
    .lang-toggle{
        display:flex;align-items:center;gap:2px;font-family:var(--ff-mono);font-size:.74rem;
        background:rgba(247,241,236,.08);border:1px solid rgba(247,241,236,.16);border-radius:100px;padding:4px;
        cursor:pointer;
    }
    .lang-toggle .lang-opt{
        padding:5px 12px;border-radius:100px;color:rgba(247,241,236,.55);transition:background .2s,color .2s;
    }
    .lang-toggle .lang-opt.active{background:var(--coral);color:#fff;font-weight:700;}
    .lang-toggle .lang-opt.unavailable{opacity:.35;cursor:not-allowed;}
    .back-link{
        display:flex;align-items:center;gap:8px;font-family:var(--ff-display);font-weight:600;font-size:.82rem;
        color:#fff;background:rgba(247,241,236,.08);border:1px solid rgba(247,241,236,.2);
        padding:9px 18px 9px 14px;border-radius:100px;transition:background .25s var(--ease),border-color .25s,transform .25s var(--ease);
    }
    .back-link svg{width:15px;height:15px;flex-shrink:0;transition:transform .3s var(--ease);}
    .back-link:hover{background:var(--coral);border-color:var(--coral);transform:translateY(-2px);}
    .back-link:hover svg{transform:translateX(-3px);}

    /* ---- article ---- */
    .article-wrap{padding:50px 0 100px;}
    .article-loading,.article-error{text-align:center;padding:80px 20px;color:var(--ink-soft);font-family:var(--ff-mono);font-size:.9rem;}
    .article-tag{
        font-family:var(--ff-mono);font-size:.72rem;letter-spacing:.08em;color:var(--coral);text-transform:uppercase;
    }
    .article-title{
        font-family:var(--ff-display);font-weight:700;font-size:clamp(1.7rem,4vw,2.4rem);color:var(--navy-950);
        margin-top:12px;line-height:1.25;
    }
    .article-date{font-family:var(--ff-mono);font-size:.78rem;color:var(--steel);margin-top:14px;}
    .article-img{margin-top:28px;border-radius:var(--radius-lg);overflow:hidden;background:#ddd;}
    .article-img img{width:100%;display:block;}
    .article-body{margin-top:30px;color:var(--ink);font-size:1.05rem;line-height:1.75;}
    .article-body.is-plain{white-space:pre-wrap;}
    .article-body p{margin:0 0 18px;}
    .article-body p:last-child{margin-bottom:0;}
    .article-body h1,.article-body h2,.article-body h3{
        font-family:var(--ff-display);font-weight:700;color:var(--navy-950);margin:32px 0 14px;line-height:1.3;
    }
    .article-body h1:first-child,.article-body h2:first-child,.article-body h3:first-child{margin-top:0;}
    .article-body h2{font-size:1.5rem;}
    .article-body h3{font-size:1.22rem;}
    .article-body ul,.article-body ol{margin:0 0 18px;padding-left:26px;}
    .article-body li{margin-bottom:8px;}
    .article-body a{color:var(--coral);text-decoration:underline;}
    .article-body blockquote{
        margin:22px 0;padding:6px 0 6px 20px;border-left:3px solid var(--coral);color:var(--ink-soft);font-style:italic;font-size:1.1rem;
    }
    .article-body strong{color:var(--navy-950);}
    .article-footer{margin-top:56px;padding-top:26px;border-top:1px solid var(--line);}
    .article-footer a{
        display:inline-flex;align-items:center;gap:8px;font-family:var(--ff-display);font-weight:600;
        font-size:.92rem;color:var(--navy-950);
    }
    .article-footer a:hover{color:var(--coral);}
</style>
</head>
<body>

<header class="mini-nav">
    <div class="wrap">
        <a href="index.html" class="mini-logo">
            <span class="mini-logo-mark"><img src="images/logo-nav.png" alt="Global Crew Valencia"></span>
            <span class="mini-logo-text">GLOBAL CREW<span>ESCUELA DE TRIPULANTES</span></span>
        </a>
        <div class="mini-nav-right">
            <button type="button" class="lang-toggle hidden" id="langToggle" aria-label="Cambiar idioma / Switch language">
                <span class="lang-opt lang-es active" data-lang="es">ES</span><span class="lang-opt lang-en" data-lang="en">EN</span>
            </button>
            <a href="blog.html" class="back-link" id="backLink"><svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="backLinkText">Volver al blog</span></a>
        </div>
    </div>
</header>

<div class="wrap article-wrap">
    <div class="article-loading" id="articleLoading">Cargando artículo...</div>
    <article class="hidden" id="articleContent">
        <span class="article-tag" id="articleTag"></span>
        <h1 class="article-title" id="articleTitle"></h1>
        <div class="article-date" id="articleDate"></div>
        <div class="article-img hidden" id="articleImgWrap"><img id="articleImg" src="" alt=""></div>
        <div class="article-body" id="articleBody"></div>
        <div class="article-footer">
            <a href="blog.html" id="footerBackLink">← <span>Ver todos los artículos</span></a>
        </div>
    </article>
</div>

<script>
    const TXT = {
        es: {
            back: 'Volver al blog', viewAll: 'Ver todos los artículos', loading: 'Cargando artículo...',
            notFound: 'No hemos encontrado este artículo. Puede que se haya movido o borrado.',
            error: 'No se ha podido cargar el artículo. Inténtalo de nuevo en un momento.',
            filters: { todas: 'Todas', noticias: 'Noticias', vida: 'Vida del TCP', curso: 'Curso TCP', curiosidades: 'Curiosidades' }
        },
        en: {
            back: 'Back to the blog', viewAll: 'View all articles', loading: 'Loading article...',
            notFound: "We couldn't find this article. It may have been moved or removed.",
            error: "Couldn't load the article. Please try again in a moment.",
            filters: { todas: 'All', noticias: 'News', vida: 'Cabin Crew Life', curso: 'Cabin Crew Course', curiosidades: 'Curiosities' }
        }
    };

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    let currentLang = params.get('lang') === 'en' ? 'en' : 'es';
    let currentPost = null;

    function formatDate(iso, lang) {
        if (!iso) return '';
        const d = new Date(iso);
        if (isNaN(d)) return '';
        return d.toLocaleDateString(lang === 'en' ? 'en-GB' : 'es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Renders the post in the given language, falling back to whichever
    // language actually has content if the requested one is empty for
    // this particular post.
    function renderInLang(lang) {
        if (!currentPost) return;
        const t = TXT[lang];
        const block = currentPost[lang] && currentPost[lang].title ? currentPost[lang]
            : (currentPost[lang === 'en' ? 'es' : 'en'] || {});

        currentLang = lang;
        document.documentElement.lang = lang;
        document.getElementById('backLinkText').textContent = t.back;
        document.getElementById('footerBackLink').querySelector('span').textContent = t.viewAll;

        document.title = (block.title || '') + ' · Blog Global Crew';
        document.getElementById('pageDescription').setAttribute('content', block.text || '');

        document.getElementById('articleTag').textContent = t.filters[currentPost.category] || currentPost.category || '';
        document.getElementById('articleTitle').textContent = block.title || '';
        document.getElementById('articleDate').textContent = formatDate(currentPost.publishedAt, lang);

        const bodyEl = document.getElementById('articleBody');
        if (block.body) {
            bodyEl.classList.remove('is-plain');
            bodyEl.innerHTML = block.body;
        } else {
            bodyEl.classList.add('is-plain');
            bodyEl.textContent = block.text || '';
        }

        document.querySelectorAll('.lang-toggle .lang-opt').forEach((el) => {
            el.classList.toggle('active', el.dataset.lang === lang);
        });
    }

    document.getElementById('langToggle').addEventListener('click', () => {
        renderInLang(currentLang === 'es' ? 'en' : 'es');
    });

    async function loadArticle() {
        const loading = document.getElementById('articleLoading');
        const content = document.getElementById('articleContent');
        const t = TXT[currentLang];

        if (!slug) {
            loading.textContent = t.notFound;
            return;
        }

        try {
            const res = await fetch(`/api/blog?slug=${encodeURIComponent(slug)}`);
            if (res.status === 404) {
                loading.textContent = t.notFound;
                return;
            }
            const data = await res.json();
            const post = data.post;
            if (!post) {
                loading.textContent = t.notFound;
                return;
            }
            currentPost = post;

            if (post.image) {
                document.getElementById('articleImg').src = post.image;
                document.getElementById('articleImg').alt = (post.es && post.es.title) || '';
                document.getElementById('articleImgWrap').classList.remove('hidden');
            }

            // Only show the language switch if there's actually a second
            // language to switch to — otherwise there's nothing to toggle.
            if (post.es && post.es.title && post.en && post.en.title) {
                document.getElementById('langToggle').classList.remove('hidden');
            }

            renderInLang(currentLang);

            loading.classList.add('hidden');
            content.classList.remove('hidden');
        } catch (err) {
            loading.textContent = t.error;
        }
    }

    loadArticle();
</script>

</body>
</html>
